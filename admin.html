<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Student Data</title>
    <!-- SheetJS & JSZip for Backup Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- Firebase SDKs (Firestore Only) -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        h1 { color: #0056b3; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #0056b3; color: white; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        select, button { padding: 10px; font-size: 16px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        #downloadZipBtn { background: #ffc107; color: #333; }
        
        .delete-btn {
            background-color: #dc3545;
            color: white;
            padding: 5px 8px;
            font-size: 12px;
            width: auto;
        }

        /* Confirmation Modal */
        #confirmModal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .modal-buttons button {
            width: 48%;
            margin: 0;
        }
        #confirmYesBtn {
            background-color: #dc3545;
            color: white;
        }
        #confirmNoBtn {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Admin Panel: Student Data</h1>
    
    <div class="controls">
        <select id="schoolFilter">
            <option value="all">All Schools</option>
        </select>
        <button id="refreshBtn">Refresh Data</button>
        <button id="downloadZipBtn">Download All Photos & Excel (ZIP)</button>
    </div>

    <table id="studentTable">
        <thead>
            <tr>
                <th>Photo</th>
                <th>Name</th>
                <th>Class</th>
                <th>Roll</th>
                <th>DOB</th>
                <th>Blood</th>
                <th>Phone</th> <!-- MODIFIED: Added Phone Column -->
                <th>School</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- MODIFIED: Colspan changed from 8 to 9 -->
            <tr><td colspan="9">Loading data...</td></tr>
        </tbody>
    </table>

    <!-- Confirmation Modal HTML -->
    <div id="confirmModal">
        <div class="modal-content">
            <p id="confirmText">Are you sure?</p>
            <div class="modal-buttons">
                <button id="confirmYesBtn">Yes</button>
                <button id="confirmNoBtn">No</button>
            </div>
        </div>
    </div>

    <script>
        let allStudents = [];
        const tableBody = document.querySelector('#studentTable tbody');
        const schoolFilter = document.getElementById('schoolFilter');
        
        const confirmModal = document.getElementById('confirmModal');
        const confirmYesBtn = document.getElementById('confirmYesBtn');
        const confirmNoBtn = document.getElementById('confirmNoBtn');
        const confirmText = document.getElementById('confirmText');
        
        let db; 
        let idToDelete = null; 

        try {
            // YOUR SPECIFIC KEYS EMBEDDED HERE
            const firebaseConfig = {
              apiKey: "AIzaSyC76wT0RbwuLGbhp0mU7kje25g-xxydLqU",
              authDomain: "idcard-60586.firebaseapp.com",
              projectId: "idcard-60586",
              storageBucket: "idcard-60586.firebasestorage.app",
              messagingSenderId: "331979663377",
              appId: "1:331979663377:web:026e537a7fcaca813129b0",
              measurementId: "G-PXVV87C78S"
            };
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore(); 
            
            loadData(db);
            document.getElementById('refreshBtn').addEventListener('click', () => loadData(db));
        } catch (e) { alert("Firebase Error: " + e.message); }

        function loadData(db) {
            // MODIFIED: Colspan changed from 8 to 9
            tableBody.innerHTML = '<tr><td colspan="9">Loading...</td></tr>';
            db.collection("students").orderBy("submittedAt", "desc").get().then((querySnapshot) => {
                allStudents = [];
                const schools = new Set();
                
                querySnapshot.forEach((doc) => {
                    const s = doc.data();
                    allStudents.push(s);
                    if(s.schoolName) schools.add(s.schoolName);
                });
                
                schoolFilter.innerHTML = '<option value="all">All Schools</option>';
                schools.forEach(school => {
                    const opt = document.createElement('option');
                    opt.value = school;
                    opt.textContent = school;
                    schoolFilter.appendChild(opt);
                });
                
                renderTable(allStudents);
            }).catch((error) => {
                console.log("Error getting documents: ", error);
                // MODIFIED: Colspan changed from 8 to 9
                tableBody.innerHTML = `<tr><td colspan="9">Error: ${error.message}</td></tr>`;
            });
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach(s => {
                const photoSrc = s.photoBase64 || 'https://placehold.co/50?text=ERR';
                // MODIFIED: Added Phone field
                const row = `<tr>
                    <td><img src="${photoSrc}" onclick="window.open('${photoSrc}')" style="cursor:pointer"></td>
                    <td>${s.name}</td>
                    <td>${s.class}</td>
                    <td>${s.roll}</td>
                    <td>${s.dob}</td>
                    <td>${s.bloodGroup || '-'}</td>
                    <td>${s.phone || '-'}</td> <!-- ADDED -->
                    <td>${s.schoolName}</td>
                    <td><button class="delete-btn" data-id="${s.id}" data-name="${s.name}">Delete</button></td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }
        
        schoolFilter.addEventListener('change', () => {
            const val = schoolFilter.value;
            if (val === 'all') renderTable(allStudents);
            else renderTable(allStudents.filter(s => s.schoolName === val));
        });

        // --- Delete Logic ---
        tableBody.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                idToDelete = e.target.dataset.id;
                const name = e.target.dataset.name || 'this student';
                confirmText.textContent = `Are you sure you want to permanently delete ${name}? This cannot be undone.`;
                confirmModal.style.display = 'flex';
            }
        });

        confirmNoBtn.addEventListener('click', () => {
            confirmModal.style.display = 'none';
            idToDelete = null;
        });

        confirmYesBtn.addEventListener('click', () => {
            if (idToDelete) {
                deleteStudent(idToDelete);
            }
            confirmModal.style.display = 'none';
            idToDelete = null;
        });

        function deleteStudent(id) {
            if (!db) return;
            
            db.collection("students").doc(id.toString()).delete()
                .then(() => {
                    console.log("Document successfully deleted from Firebase!");
                    allStudents = allStudents.filter(s => s.id.toString() !== id);
                    const val = schoolFilter.value;
                    if (val === 'all') renderTable(allStudents);
                    else renderTable(allStudents.filter(s => s.schoolName === val));
                }).catch((error) => {
                    console.error("Error removing document: ", error);
                });
        }
        // --- END: Delete Logic ---


        document.getElementById('downloadZipBtn').addEventListener('click', async () => {
            if(allStudents.length === 0) return alert("No data");
            const btn = document.getElementById('downloadZipBtn');
            btn.disabled = true; btn.textContent = "Generating Zip...";
            
            const val = schoolFilter.value;
            const dataToExport = (val === 'all') ? allStudents : allStudents.filter(s => s.schoolName === val);
            
            try {
                const zip = new JSZip();
                
                dataToExport.forEach(s => {
                    if(s.photoBase64) {
                        const byteString = atob(s.photoBase64.split(',')[1]);
                        const ab = new ArrayBuffer(byteString.length);
                        const ia = new Uint8Array(ab);
                        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                        zip.file(s.newPhotoName, new Blob([ab], {type: 'image/jpeg'}));
                    }
                });
                
                const excelData = dataToExport.map(s => {
                    let d = s.dob; try { const [y,m,dy] = s.dob.split('-'); d = `${dy}/${m}/${y}`; } catch(e){}
                    return { name: s.name, class: s.class, dob: d, bloodGroup: s.bloodGroup||'', rollno: s.roll, phone: s.phone, photo: 'E:\\photo\\'+s.newPhotoName };
                });
                const ws = XLSX.utils.json_to_sheet(excelData, { header: ['name','class','dob','bloodGroup','rollno','phone','photo'] });
                const wb = XLSX.utils.book_new(); 
                
                let sheetName = (val === 'all' ? 'All_Schools' : val).replace(/[\\/?*\[\]:]/g, "").substring(0, 31);
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
                
                const excelBlob = new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
                zip.file('student_data.xlsx', excelBlob);

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(zipBlob);
                link.download = `${sheetName}_Backup.zip`;
                link.click();
            } catch(e) {
                console.error(e);
                alert("Error creating zip: " + e.message);
            } finally {
                btn.disabled = false; btn.textContent = "Download All Photos & Excel (ZIP)";
            }
        });
    </script>
</body>
</html>
