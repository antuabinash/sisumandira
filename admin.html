<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Student Data</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        h1 { color: #0056b3; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #0056b3; color: white; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        select, button { padding: 10px; font-size: 16px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Admin Panel: Student Data</h1>
    
    <div class="controls">
        <select id="schoolFilter">
            <option value="all">All Schools</option>
        </select>
        <button id="refreshBtn">Refresh Data</button>
        <button id="downloadExcelBtn">Download Excel</button>
    </div>

    <table id="studentTable">
        <thead>
            <tr>
                <th>Photo</th>
                <th>Name</th>
                <th>Class</th>
                <th>Roll</th>
                <th>DOB</th>
                <th>Blood</th>
                <th>Phone</th>
                <th>School</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="8">Loading data...</td></tr>
        </tbody>
    </table>

    <script>
        let allStudents = [];
        const tableBody = document.querySelector('#studentTable tbody');
        const schoolFilter = document.getElementById('schoolFilter');

        try {
            // !! IMPORTANT !! REPLACE WITH YOUR NEW KEYS
            const firebaseConfig = {
  apiKey: "AIzaSyC76wT0RbwuLGbhp0mU7kje25g-xxydLqU",
  authDomain: "idcard-60586.firebaseapp.com",
  projectId: "idcard-60586",
  storageBucket: "idcard-60586.firebasestorage.app",
  messagingSenderId: "331979663377",
  appId: "1:331979663377:web:026e537a7fcaca813129b0",
  measurementId: "G-PXVV87C78S"
};
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            
            loadData(db);
            document.getElementById('refreshBtn').addEventListener('click', () => loadData(db));
        } catch (e) { alert("Firebase Error: " + e.message); }

        function loadData(db) {
            tableBody.innerHTML = '<tr><td colspan="8">Loading...</td></tr>';
            db.collection("students").orderBy("submittedAt", "desc").get().then((querySnapshot) => {
                allStudents = [];
                const schools = new Set();
                
                querySnapshot.forEach((doc) => {
                    const s = doc.data();
                    allStudents.push(s);
                    if(s.schoolName) schools.add(s.schoolName);
                });
                
                schoolFilter.innerHTML = '<option value="all">All Schools</option>';
                schools.forEach(school => {
                    const opt = document.createElement('option');
                    opt.value = school;
                    opt.textContent = school;
                    schoolFilter.appendChild(opt);
                });
                
                renderTable(allStudents);
            }).catch((error) => {
                console.log("Error getting documents: ", error);
                tableBody.innerHTML = `<tr><td colspan="8">Error: ${error.message}</td></tr>`;
            });
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach(s => {
                const row = `<tr>
                    <td><a href="${s.photoURL}" target="_blank"><img src="${s.photoURL}" onerror="this.src='https://placehold.co/50?text=ERR'"></a></td>
                    <td>${s.name}</td>
                    <td>${s.class}</td>
                    <td>${s.roll}</td>
                    <td>${s.dob}</td>
                    <td>${s.bloodGroup || '-'}</td>
                    <td>${s.phone}</td>
                    <td>${s.schoolName}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }
        
        schoolFilter.addEventListener('change', () => {
            const val = schoolFilter.value;
            if (val === 'all') renderTable(allStudents);
            else renderTable(allStudents.filter(s => s.schoolName === val));
        });

        document.getElementById('downloadExcelBtn').addEventListener('click', () => {
            if(allStudents.length === 0) return alert("No data to download");
            
            const val = schoolFilter.value;
            const dataToExport = (val === 'all') ? allStudents : allStudents.filter(s => s.schoolName === val);
            
            const excelData = dataToExport.map(s => ({
                School: s.schoolName,
                Name: s.name,
                Class: s.class,
                Roll: s.roll,
                DOB: s.dob,
                Blood: s.bloodGroup || '',
                Phone: s.phone,
                PhotoURL: s.photoURL
            }));
            
            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Students");
            XLSX.writeFile(wb, "Student_Data_Admin.xlsx");
        });
    </script>
</body>
</html>
